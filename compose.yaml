services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      TOKEN: ${TOKEN:?Set TOKEN in .env}
      ADMINS: ${ADMINS:?Set ADMINS in .env}
      ROOT_PASS: ${ROOT_PASS:?Set ROOT_PASS in .env}
      PG_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-poker_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-poker_db}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-poker_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-poker_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
